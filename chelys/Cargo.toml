[package]
name = "chelys"
description = "Audio encoders implemented from their specifications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
chelys-aac = { path = "../chelys-aac", optional = true }
chelys-mp3 = { path = "../chelys-mp3", optional = true }
chelys-mp4 = { path = "../chelys-mp4", optional = true, default-features = false }
chelys-ogg = { path = "../chelys-ogg", optional = true }
chelys-vorbis = { path = "../chelys-vorbis", optional = true }

[features]
default = ["aac", "mp3", "mp4"]
# AAC-LC: see chelys-aac's documentation.
aac = ["dep:chelys-aac", "chelys-mp4?/aac"]
mp3 = ["dep:chelys-mp3"]
# MP4 files of AAC-LC with `aac`, and of FLAC, Opus, AAC-LC and ALAC packets
# from any encoder: see chelys-mp4's documentation.
mp4 = ["dep:chelys-mp4"]
# Vorbis I packets.
vorbis = ["dep:chelys-vorbis"]
# Ogg streams of chelys's Vorbis: see chelys-ogg's documentation.
ogg = ["dep:chelys-ogg", "vorbis"]
# Each codec's building blocks, for chelys's own conformance tests.
unstable = [
    "chelys-aac?/unstable",
    "chelys-mp3?/unstable",
    "chelys-ogg?/unstable",
    "chelys-vorbis?/unstable",
]

[[example]]
name = "mp3_tone"
required-features = ["mp3"]

[[example]]
name = "mp3_vbr"
required-features = ["mp3"]
