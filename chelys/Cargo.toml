[package]
name = "chelys"
description = "Audio encoders implemented from their specifications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
chelys-aac = { path = "../chelys-aac", optional = true }
chelys-mp3 = { path = "../chelys-mp3", optional = true }

[features]
default = ["aac", "mp3"]
# AAC-LC: see chelys-aac's documentation.
aac = ["dep:chelys-aac"]
mp3 = ["dep:chelys-mp3"]
# Each codec's building blocks, for chelys's own conformance tests.
unstable = ["chelys-aac?/unstable", "chelys-mp3?/unstable"]

[[example]]
name = "mp3_tone"
required-features = ["mp3"]

[[example]]
name = "mp3_vbr"
required-features = ["mp3"]
