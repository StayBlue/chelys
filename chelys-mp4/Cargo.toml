[package]
name = "chelys-mp4"
description = "Writes MP4 files of chelys's AAC-LC streams, and of FLAC, Opus and AAC-LC packets from any encoder, from ISO/IEC 14496-12, 14496-14, 14496-1 and 14496-34 and the codecs' mappings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
chelys-aac = { path = "../chelys-aac", optional = true }

[features]
default = ["aac"]
# AAC-LC from chelys-aac's encoder. AAC-LC packets from any encoder need no
# feature.
aac = ["dep:chelys-aac"]
