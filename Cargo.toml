[workspace]
resolver = "3"
members = ["chelys", "chelys-cli", "chelys-conformance"]
# Plain `cargo test` stays fast and hermetic; run the decoder-backed checks
# with `cargo test --workspace` or `-p chelys-conformance`.
default-members = ["chelys", "chelys-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
