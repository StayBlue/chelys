[package]
name = "chelys-cli"
description = "Encodes raw PCM from stdin with chelys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "chelys"
path = "src/main.rs"
# Its name is the library's, and cargo doc would write both to one page.
doc = false

[dependencies]
chelys = { path = "../chelys" }
